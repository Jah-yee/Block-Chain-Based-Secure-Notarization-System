<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="180" height="180" rx="40" fill="#0A2540" />
  
  <!-- Outer Glow -->
  <circle cx="90" cy="90" r="60" fill="#10b981" fill-opacity="0.15" filter="url(#shadow)" />

  <!-- Shield Icon -->
  <g transform="translate(45, 40) scale(3.8)">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" 
          stroke="url(#shieldGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M12 8v4M12 16h.01" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>