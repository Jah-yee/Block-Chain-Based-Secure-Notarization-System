<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBSNS Remote Auth</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        .emerald-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const BACKEND_URL = "http://localhost:5000";

        function App() {
            const [status, setStatus] = useState("loading");
            const [error, setError] = useState(null);
            const [sessionId, setSessionId] = useState(null);
            const [challenge, setChallenge] = useState(null);
            const [walletAddress, setWalletAddress] = useState(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const sid = params.get("sessionId");
                if (!sid) {
                    setError("Session ID missing. Please restart login from the desktop app.");
                    setStatus("error");
                    return;
                }
                setSessionId(sid);
                fetchSession(sid);
            }, []);

            const fetchSession = async (sid) => {
                try {
                    const res = await fetch(`${BACKEND_URL}/api/auth/remote/status/${sid}`);
                    if (!res.ok) throw new Error(res.status === 404 ? "Session not found." : "Failed to load session.");
                    const data = await res.json();
                    if (data.status === "expired") { setStatus("expired"); return; }
                    if (data.status === "authorized") { setStatus("authorized"); return; }
                    setChallenge(data.challenge);
                    setStatus("ready");
                } catch (err) { setError(err.message); setStatus("error"); }
            };

            const handleAuthorize = async () => {
                if (!window.ethereum) { alert("MetaMask not found!"); return; }
                setStatus("signing");
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    const signature = await signer.signMessage(challenge);
                    const res = await fetch(`${BACKEND_URL}/api/auth/remote/authorize`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ sessionId, walletAddress: address, signature })
                    });
                    if (!res.ok) throw new Error("Authorization failed.");
                    setStatus("authorized");
                    setTimeout(() => window.close(), 3000);
                } catch (err) { alert(err.message); setStatus("ready"); }
            };

            return (
                <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 emerald-glow">
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center mb-6">
                            <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <h1 class="text-2xl font-bold text-white mb-2">Remote Authentication</h1>
                        <p class="text-slate-400 text-sm mb-8 text-center italic opacity-75">Secure Remote Signer for BBSNS</p>

                        {status === "loading" && <div class="w-10 h-10 border-4 border-emerald-500/20 border-t-emerald-400 rounded-full spin mb-4"></div>}

                        {status === "ready" && (
                            <div class="w-full space-y-6">
                                <div class="p-4 bg-emerald-500/5 border border-emerald-500/10 rounded-xl text-xs text-emerald-400 flex flex-col gap-2">
                                    <span class="font-bold opacity-50 uppercase tracking-widest">Active Session</span>
                                    <code class="break-all font-mono">{sessionId}</code>
                                </div>
                                <button onClick={handleAuthorize} class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition-all shadow-lg hover:shadow-emerald-500/20 flex items-center justify-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                                    Sign & Authorize
                                </button>
                                <p class="text-[10px] text-slate-500 text-center uppercase tracking-widest">Powered by BBSNS Blockchain Security</p>
                            </div>
                        )}

                        {status === "signing" && (
                            <div class="text-center">
                                <div class="w-12 h-12 border-4 border-emerald-500/10 border-t-emerald-400 rounded-full spin mx-auto mb-4"></div>
                                <p class="text-emerald-400 font-bold animate-pulse">Check MetaMask</p>
                                <p class="text-xs text-slate-500">Signing the secure challenge to enable desktop access.</p>
                            </div>
                        )}

                        {status === "authorized" && (
                            <div class="text-center space-y-4">
                                <div class="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-emerald-500/30">
                                    <svg class="w-12 h-12 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Authorized</h2>
                                <p class="text-slate-400 text-sm">Your desktop session is now verified. This window will close automatically.</p>
                            </div>
                        )}

                        {status === "expired" && <div class="p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xs font-bold text-center">Session Expired.<br />Please restart login in the desktop app.</div>}
                        {status === "error" && <div class="p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xs font-bold text-center">{error}</div>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
